<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>Takamura · Vérification Gratuite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: 'Oswald', sans-serif;
            color: #f3eee3;
            background: #050505;
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
        }
        :root {
            --panel: #0d0c0d;
            --line: rgba(201, 162, 39, 0.18);
            --red: #b3151f;
            --red-bright: #ff2d3d;
            --gold: #c9a227;
            --gold-light: #eccd6e;
            --green: #34d399;
            --text-dim: #948c80;
        }

        header {
            display: flex; align-items: center; justify-content: space-between;
            max-width: 560px; margin: 0 auto; padding: 22px 24px;
            border-bottom: 1px solid var(--line);
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-mark {
            width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cinzel', serif; font-size: 12px; font-weight: 700; color: var(--gold-light);
        }
        .brand-name { font-family: 'Cinzel', serif; font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
        .brand-sub { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); margin-top: 1px; }
        header a { color: var(--text-dim); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; }
        header a:hover { color: var(--gold-light); }

        main { max-width: 560px; margin: 0 auto; padding: 54px 24px 40px; }

        .tag {
            display: inline-block; margin: 0 auto 22px; padding: 6px 14px;
            border: 1px solid var(--line); border-radius: 999px;
            font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-light);
        }
        .tag-wrap { text-align: center; }

        h1 {
            font-family: 'Cinzel', serif; font-weight: 900; text-align: center;
            font-size: clamp(32px, 8vw, 44px); line-height: 1.1; margin: 0 0 18px; color: #f6f1e6;
        }
        .lede { text-align: center; color: var(--text-dim); font-size: 15px; line-height: 1.6; max-width: 420px; margin: 0 auto 42px; }

        .panel { border: 1px solid var(--line); border-radius: 4px; padding: 26px 24px; background: var(--panel); }
        .panel + .panel { margin-top: 22px; }
        .panel-label {
            display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
            font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-dim);
        }
        .panel-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }

        .field-label { display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 9px; }
        .input-row {
            display: flex; align-items: center; gap: 8px;
            border: 1px solid var(--line); border-radius: 3px; padding: 13px 14px;
            transition: border-color 0.2s ease;
        }
        .input-row:focus-within { border-color: var(--gold); }
        .input-row.error { border-color: var(--red-bright); animation: shake 0.4s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .input-row .prefix { color: var(--gold-light); font-family: 'JetBrains Mono', monospace; font-weight: 600; }
        .input-row input {
            flex: 1; background: none; border: none; outline: none; color: #f3eee3;
            font-family: 'JetBrains Mono', monospace; font-size: 16px;
        }
        .input-row input::placeholder { color: #55504a; }

        .verify-btn {
            width: 100%; margin-top: 16px; padding: 15px 0;
            background: var(--gold); border: none; border-radius: 3px;
            color: #14100a; font-family: 'Oswald', sans-serif; font-weight: 600;
            letter-spacing: 0.2em; font-size: 13px; text-transform: uppercase; cursor: pointer;
            transition: background 0.15s ease, opacity 0.2s ease;
        }
        .verify-btn:hover { background: var(--gold-light); }
        .verify-btn:disabled { opacity: 0.55; cursor: default; }
        .verify-btn:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 2px; }

        .empty-rows .data-row .v { color: #55504a; }

        .data-row {
            display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
            padding: 13px 0; border-bottom: 1px solid var(--line);
        }
        .data-row:last-child { border-bottom: none; }
        .data-row .k { font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); white-space: nowrap; }
        .data-row .v { font-family: 'JetBrains Mono', monospace; font-size: 14px; text-align: right; color: #ece4d3; }
        .data-row .v.status-ok { color: var(--green); }
        .data-row .v.status-banned { color: var(--red-bright); }

        .quote-line {
            margin: 18px 0 0; padding-top: 16px; border-top: 1px dashed var(--line);
            font-family: 'Cinzel', serif; font-style: italic; font-size: 14px; text-align: center;
            color: var(--gold-light); line-height: 1.6;
        }

        .foot-note { text-align: center; color: var(--text-dim); font-size: 12px; margin: 22px 0 0; }
        .again-btn {
            width: 100%; margin-top: 14px; padding: 14px 0;
            background: none; border: 1px solid var(--line); border-radius: 3px;
            color: #d8d1c4; font-family: 'Oswald', sans-serif; font-weight: 500;
            letter-spacing: 0.16em; font-size: 12.5px; text-transform: uppercase; cursor: pointer;
        }
        .again-btn:hover { border-color: var(--gold); color: var(--gold-light); }

        .hidden { display: none; }

        footer {
            max-width: 560px; margin: 0 auto; padding: 30px 24px 40px;
            text-align: center; font-size: 11px; letter-spacing: 0.14em; color: #57524a; text-transform: uppercase;
        }
        footer .brand-inline { color: var(--red-bright); }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-mark">TK</div>
            <div>
                <div class="brand-name">Takamura</div>
                <div class="brand-sub">Check Ban</div>
            </div>
        </div>
    </header>

    <main>
        <div class="tag-wrap"><span class="tag">Gratuit, sans limite</span></div>
        <h1>Vérification de ban</h1>
        <p class="lede">Vérifie n'importe quel numéro WhatsApp en quelques secondes. Statut, raison, rien de plus.</p>

        <section class="panel">
            <div class="panel-label">Numéro à vérifier</div>
            <label class="field-label" for="phone">Numéro WhatsApp</label>
            <div class="input-row" id="inputRow">
                <span class="prefix">+</span>
                <input id="phone" type="tel" inputmode="numeric" placeholder="237699777530" />
            </div>
            <button id="verifyBtn" class="verify-btn">Vérifier</button>
        </section>

        <section class="panel hidden" id="result">
            <div class="panel-label">Résultat</div>
            <div class="data-row">
                <span class="k">Numéro</span>
                <span class="v" id="resultNumber">—</span>
            </div>
            <div class="data-row">
                <span class="k">Statut</span>
                <span class="v" id="rowStatus">—</span>
            </div>
            <div class="data-row">
                <span class="k">Raison</span>
                <span class="v" id="rowReason">—</span>
            </div>
            <div class="data-row">
                <span class="k">Vérifié</span>
                <span class="v" id="rowSince">—</span>
            </div>
            <p class="quote-line" id="quoteText"></p>
            <button class="again-btn" id="againBtn">Vérifier un autre numéro</button>
        </section>

        <p class="foot-note">100% gratuit. Aucune inscription requise.</p>
    </main>

    <footer>© 2026 <span class="brand-inline">Takamura</span> · Check Ban</footer>

    <script>
        (function() {
            'use strict';

            const CHECK_ENDPOINT = '/api/checkban';

            const QUOTES = {
                active: [
                    "L'aura demeure.",
                    "Le fil n'est pas rompu.",
                    "La voie reste ouverte.",
                    "Rien n'a encore vacillé."
                ],
                banned: [
                    "Le silence parle.",
                    "Ce n'est pas une fin.",
                    "Une porte se ferme, une autre s'ouvrira.",
                    "Relève-toi. Le chemin continue."
                ]
            };

            function pickQuote(isBanned) {
                const pool = isBanned ? QUOTES.banned : QUOTES.active;
                return pool[Math.floor(Math.random() * pool.length)];
            }

            const phoneInput = document.getElementById('phone');
            const inputRow = document.getElementById('inputRow');
            const verifyBtn = document.getElementById('verifyBtn');
            const result = document.getElementById('result');
            const resultNumber = document.getElementById('resultNumber');
            const rowStatus = document.getElementById('rowStatus');
            const rowReason = document.getElementById('rowReason');
            const rowSince = document.getElementById('rowSince');
            const quoteText = document.getElementById('quoteText');
            const againBtn = document.getElementById('againBtn');

            function showError() {
                inputRow.classList.add('error');
                setTimeout(() => inputRow.classList.remove('error'), 400);
            }

            function renderResult(phone, isBanned, extra) {
                resultNumber.textContent = '+' + phone;

                rowStatus.textContent = isBanned ? 'Banni' : 'Actif';
                rowStatus.className = 'v ' + (isBanned ? 'status-banned' : 'status-ok');

                rowReason.textContent = extra || '—';
                rowSince.textContent = new Date().toLocaleString('fr-FR');

                quoteText.textContent = pickQuote(isBanned);

                result.classList.remove('hidden');
                result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            async function checkBanStatus(phone) {
                const response = await fetch(CHECK_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erreur serveur');
                }

                return { isBanned: data.banned === true, message: data.message };
            }

            verifyBtn.addEventListener('click', async () => {
                const raw = phoneInput.value.trim();
                const digitsOnly = raw.replace(/\D/g, '');

                if (!digitsOnly || digitsOnly.length < 8) {
                    showError();
                    return;
                }

                verifyBtn.disabled = true;
                verifyBtn.textContent = 'Vérification…';

                try {
                    const { isBanned, message } = await checkBanStatus(digitsOnly);
                    renderResult(digitsOnly, isBanned, message);
                } catch (err) {
                    inputRow.classList.add('error');
                    console.error('Erreur de vérification :', err);
                    alert('Impossible de contacter le serveur. Vérifie que index.js tourne bien.');
                } finally {
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'Vérifier';
                }
            });

            phoneInput.addEventListener('input', () => {
                phoneInput.value = phoneInput.value.replace(/[^\d]/g, '');
            });

            phoneInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') verifyBtn.click();
            });

            againBtn.addEventListener('click', () => {
                result.classList.add('hidden');
                phoneInput.value = '';
                phoneInput.focus();
            });
        })();
    </script>
</body>
</html>
