<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification de compte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --ink: #1A2233;
    --ink-soft: #5B6472;
    --line: #E1E4E9;
    --accent: #2F5D8A;
    --accent-soft: #EAF1F7;
    --ok: #2F7A52;
    --ok-bg: #EAF4EE;
    --danger: #B3432B;
    --danger-bg: #FBEEE9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 20px 40px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  .mark {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink);
  }

  .mark span { color: var(--accent); }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.25;
    max-width: 480px;
    margin: 22px auto 8px;
  }

  .sub {
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 420px;
    margin: 0 auto;
    line-height: 1.5;
  }

  main {
    width: 100%;
    max-width: 460px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 28px;
  }

  form {
    display: flex;
    gap: 8px;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .field {
    flex: 1;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    color: var(--ink);
    background: var(--bg);
  }

  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }

  button {
    align-self: flex-end;
    padding: 12px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 3px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: #26496D; }
  button:disabled { background: #A9B3BE; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .hint {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 10px;
  }

  #result-wrap { margin-top: 24px; }

  .receipt {
    border-top: 1px dashed var(--line);
    padding-top: 20px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 0;
    font-size: 14px;
  }

  .row .label {
    color: var(--ink-soft);
  }

  .row .value {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink);
    text-align: right;
  }

  .status-row {
    border-top: 1px dashed var(--line);
    margin-top: 8px;
    padding-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .status-label {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
  }

  .status-pill.ok { background: var(--ok-bg); color: var(--ok); }
  .status-pill.danger { background: var(--danger-bg); color: var(--danger); }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  .msg {
    font-size: 14px;
    padding: 14px 16px;
    border-radius: 3px;
    background: var(--danger-bg);
    color: var(--danger);
  }

  .loading {
    font-size: 14px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    margin-top: 32px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
  }

  @media (max-width: 480px) {
    form { flex-direction: column; }
    button { align-self: stretch; }
  }
</style>
</head>
<body>

<header>
  <div class="mark">Vérif<span>·</span>Compte</div>
  <h1>Vérifier le statut d'un compte</h1>
  <p class="sub">Entre un UID pour consulter ses informations et son statut actuel.</p>
</header>

<main>
  <div class="panel">
    <form id="check-form" autocomplete="off">
      <div class="field">
        <label for="uid">UID du compte</label>
        <input type="text" id="uid" name="uid" placeholder="Ex. 2513698016" inputmode="numeric" required>
      </div>
      <button type="submit" id="submit-btn">Vérifier</button>
    </form>
    <div id="result-wrap"></div>
  </div>
  <footer>Les données proviennent d'un service tiers et peuvent varier en fiabilité.</footer>
</main>

<script>
  const form = document.getElementById('check-form');
  const uidInput = document.getElementById('uid');
  const submitBtn = document.getElementById('submit-btn');
  const resultWrap = document.getElementById('result-wrap');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function renderLoading() {
    resultWrap.innerHTML = `
      <div class="receipt">
        <div class="loading"><span class="spinner"></span> Vérification en cours…</div>
      </div>`;
  }

  function renderError(message) {
    resultWrap.innerHTML = `
      <div class="receipt">
        <div class="msg">${escapeHtml(message)}</div>
      </div>`;
  }

  function renderResult(data) {
    const banned = data.is_banned === true;
    const hasStatusInfo = data.is_banned !== null && data.is_banned !== undefined;

    const rows = [
      ['Pseudo', data.nickname || '—'],
      ['UID', data.uid || '—'],
      ['Niveau', data.AccountLevel ?? '—'],
      ['Région', data.region || '—'],
      ['Dernière connexion', data.Last_Login || data.AccountLastLogin || '—'],
    ].map(([label, value]) => `
      <div class="row">
        <span class="label">${escapeHtml(label)}</span>
        <span class="value">${escapeHtml(String(value))}</span>
      </div>
    `).join('');

    const statusHtml = hasStatusInfo
      ? `<span class="status-pill ${banned ? 'danger' : 'ok'}">
           <span class="dot"></span> ${banned ? 'Banni' : 'Actif'}
         </span>`
      : `<span class="status-pill danger"><span class="dot"></span> Inconnu</span>`;

    resultWrap.innerHTML = `
      <div class="receipt">
        ${rows}
        <div class="status-row">
          <span class="status-label">Statut du compte</span>
          ${statusHtml}
        </div>
      </div>
      ${data.error ? `<div class="msg" style="margin-top:14px;">${escapeHtml(data.error)}</div>` : ''}
    `;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const uid = uidInput.value.trim();
    if (!uid) return;

    submitBtn.disabled = true;
    renderLoading();

    try {
      const res = await fetch(`/bancheck?uid=${encodeURIComponent(uid)}`);
      const data = await res.json();

      if (res.status === 400) {
        renderError(data.error || "UID invalide.");
      } else {
        renderResult(data);
      }
    } catch (err) {
      renderError("Impossible de contacter le service de vérification. Réessaie dans un instant.");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
